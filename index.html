<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>School Accessibility Passport Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&family=Carlito:ital,wght@0,400;0,700;1,400&family=Lexend:wght@400;600&display=swap">
<style>
/* Layout: branded app shell (prototype strip, header, one centred column per screen); ADHD Scotland teal for actions, purple for identity and the AI */
:root{
  --bg:#f6f9f9; --surface:#ffffff; --surface-2:#eef6f6; --ink:#1d1d1d; --text:#8b8d8e; --muted:#878787;
  --line:#d3dede; --line-soft:#e5eded; --teal:#0d9ea2; --teal-strong:#0a7f83; --teal-hover:#3fb3b6; --magenta:#d7368c; --magenta-tint:#fbe8f2; --teal-bright:#0d9ea2; --teal-tint:#e2f2f2;
  --purple:#82368c; --purple-tint:#f6eef7; --purple-line:#dcc4df; --on-accent:#1d1d1d;
  --note-bg:#fff4e2; --note-ink:#7a4300; --ok:#1d6b3b; --ok-bg:#e5f3ea; --bad:#a23a2a; --bad-bg:#fbe9e6;
  --font:Calibri,Carlito,"Segoe UI",sans-serif; --font-head:"Gotham Rounded",Nunito,"Trebuchet MS",sans-serif; --lh:1.55;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111717; --surface:#1a2222; --surface-2:#212d2d; --ink:#eef3f3; --text:#d0d8d8; --muted:#a6b1b1;
  --line:#34403f; --line-soft:#2a3434; --teal:#3cbcbf; --teal-strong:#64cfd1; --teal-bright:#0d9ea2; --teal-tint:#173637;
  --purple:#cf92d6; --purple-tint:#2b1f2e; --purple-line:#5a3d60; --on-accent:#05211f; --teal-hover:#64cfd1; --magenta:#ec7ab5; --magenta-tint:#3a1a2b;
  --note-bg:#33270f; --note-ink:#f2c98a; --ok:#8fd6a8; --ok-bg:#16301f; --bad:#f0a497; --bad-bg:#3a1d18; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111717; --surface:#1a2222; --surface-2:#212d2d; --ink:#eef3f3; --text:#d0d8d8; --muted:#a6b1b1;
  --line:#34403f; --line-soft:#2a3434; --teal:#3cbcbf; --teal-strong:#64cfd1; --teal-bright:#0d9ea2; --teal-tint:#173637;
  --purple:#cf92d6; --purple-tint:#2b1f2e; --purple-line:#5a3d60; --on-accent:#05211f; --teal-hover:#64cfd1; --magenta:#ec7ab5; --magenta-tint:#3a1a2b;
  --note-bg:#33270f; --note-ink:#f2c98a; --ok:#8fd6a8; --ok-bg:#16301f; --bad:#f0a497; --bad-bg:#3a1d18; color-scheme:dark}
/* Reader settings chosen inside the app */
.app.bg-cream{--bg:#f7f0dc; --surface:#fffbef; --surface-2:#f3ead2; --line:#e0d5b8; --line-soft:#ece3c9; color-scheme:light;
  --ink:#1d1d1d; --text:#8b8d8e; --muted:#878787; --teal:#0d9ea2; --teal-strong:#0a7f83; --teal-hover:#3fb3b6; --teal-tint:#e6efe4; --purple:#82368c; --purple-tint:#f4ead8; --on-accent:#1d1d1d; --magenta:#d7368c; --magenta-tint:#f7e3e6}
.app.bg-blue{--bg:#e6eff8; --surface:#f4f8fd; --surface-2:#dde8f4; --line:#c6d5e6; --line-soft:#d6e2ef; color-scheme:light;
  --ink:#1d1d1d; --text:#8b8d8e; --muted:#878787; --teal:#0d9ea2; --teal-strong:#0a7f83; --teal-hover:#3fb3b6; --teal-tint:#dcecf0; --purple:#7b3285; --purple-tint:#ece4f3; --on-accent:#1d1d1d; --magenta:#d7368c; --magenta-tint:#f2e3ef}
.app.bg-dark{--bg:#111717; --surface:#1a2222; --surface-2:#212d2d; --ink:#eef3f3; --text:#d0d8d8; --muted:#a6b1b1;
  --line:#34403f; --line-soft:#2a3434; --teal:#3cbcbf; --teal-strong:#64cfd1; --teal-tint:#173637;
  --purple:#cf92d6; --purple-tint:#2b1f2e; --purple-line:#5a3d60; --on-accent:#05211f; --teal-hover:#64cfd1; --magenta:#ec7ab5; --magenta-tint:#3a1a2b; color-scheme:dark}
.app.font-dys{--font:"Lexend","Verdana",sans-serif; --font-head:"Lexend","Verdana",sans-serif}
.app.reduce *{transition:none!important;animation:none!important}

*{box-sizing:border-box}
html{font-size:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font)}
.app{min-height:100vh;background:var(--bg);color:var(--text);font-family:var(--font);font-size:1rem;line-height:var(--lh)}
a{color:var(--teal)} a:hover{color:var(--teal-strong)}
h1,h2,h3{color:var(--ink);margin:0;line-height:1.25;text-wrap:balance;font-family:var(--font-head)}
h1{font-size:1.9rem;font-weight:700} h2{font-size:1.25rem;font-weight:700} h3{font-size:1.06rem;font-weight:600}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--teal-bright);outline-offset:2px;border-radius:4px}
.muted{color:var(--muted);font-size:.9rem}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Prototype strip */
.proto{background:var(--note-bg);color:var(--note-ink);font-size:.86rem;border-bottom:1px solid var(--line)}
.proto .in{max-width:1180px;margin:0 auto;display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;justify-content:space-between;padding-block:8px}
.proto strong{font-weight:700}
.seg{display:inline-flex;border:1px solid currentColor;border-radius:999px;overflow:hidden}
.seg button{background:transparent;border:0;padding:6px 14px;min-height:34px;cursor:pointer;color:inherit;font-weight:600;font-size:.85rem}
.seg button[aria-pressed="true"]{background:var(--note-ink);color:var(--note-bg)}
.linkbtn{background:none;border:0;padding:0;color:inherit;text-decoration:underline;cursor:pointer;font-size:.85rem}

/* Header */
.hdr{background:var(--surface);border-bottom:6px solid var(--teal-bright);border-image:linear-gradient(90deg,var(--teal-bright) 0 34%,var(--purple) 34% 67%,var(--magenta) 67%) 1}
.hdr .in{max-width:1180px;margin:0 auto;display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between;padding-block:12px}
.brand{display:flex;align-items:center;gap:14px;text-decoration:none;color:var(--purple);font-weight:700;font-size:1.05rem;font-family:var(--font-head);background:none;border:0;cursor:pointer;padding:0}
.brand .chip{background:#fff;border-radius:8px;padding:4px 6px;display:flex}
.brand img{height:52px;width:auto;display:block}
.nav{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;font-weight:600}
.nav button{background:none;border:0;cursor:pointer;color:var(--text);font-weight:600;padding:8px 2px;min-height:40px}
.nav button[aria-current="page"]{color:var(--teal);box-shadow:inset 0 -3px 0 var(--teal-bright)}
.nav .who{color:var(--muted);font-weight:400;font-size:.9rem}

main{max-width:1180px;margin:0 auto;padding-block:32px 72px;display:flex;flex-direction:column;gap:24px}
.narrow{max-width:880px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.split{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}
.split > .main{flex:999 1 540px;min-width:0;display:flex;flex-direction:column;gap:16px}
.split > .side{flex:1 1 300px;min-width:0;display:flex;flex-direction:column;gap:16px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:22px;display:flex;flex-direction:column;gap:14px}
.card.hl{border:2px solid var(--teal)}
.lede{font-size:1.08rem;max-width:62ch}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:5px;border:1.5px solid var(--teal);background:var(--surface);color:var(--teal);font-weight:700;font-size:.95rem;cursor:pointer;text-decoration:none;transition:background .15s}
.btn:hover{background:var(--teal-tint);color:var(--teal-strong)}
.btn.primary{background:var(--teal);color:var(--on-accent)}
.btn.primary:hover{background:var(--teal-hover);color:var(--on-accent)}
.btn.quiet{border-color:var(--line);color:var(--text);font-weight:600}
.btn.on{background:var(--teal-tint);border-color:var(--teal)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn svg{width:18px;height:18px}

.field{display:flex;flex-direction:column;gap:6px;font-size:.9rem;font-weight:600;color:var(--ink)}
.field input,.field select,.field textarea,textarea.ta{font-weight:400;padding:10px 12px;border:1px solid var(--line);border-radius:5px;background:var(--surface);color:var(--text);width:100%;line-height:var(--lh)}
.field textarea,textarea.ta{min-height:96px;resize:vertical}
.hint{font-weight:400;color:var(--muted);font-size:.82rem}
.check{display:flex;gap:10px;align-items:flex-start;line-height:1.45;cursor:pointer}
.check input{width:20px;height:20px;margin:1px 0 0;flex:none;accent-color:var(--teal)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip-opt{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 14px;border:1px solid var(--line);border-radius:999px;font-size:.9rem;cursor:pointer;background:var(--surface)}
.chip-opt input{margin:0;width:16px;height:16px;accent-color:var(--teal)}
.chip-opt:has(input:checked){border-color:var(--teal);background:var(--teal-tint);color:var(--ink)}
fieldset{border:0;padding:0;margin:0;min-width:0}
legend{padding:0;font-weight:600;color:var(--ink);margin-bottom:10px}

.tag{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;font-size:.8rem;font-weight:600;border:1px solid var(--line);white-space:nowrap;background:var(--surface)}
.tag.draft{border-style:dashed}
.tag.teacher{background:var(--purple-tint);border-color:var(--purple-line);color:var(--purple)}
.tag.sign{background:var(--magenta-tint);border-color:var(--magenta);color:var(--ink)}
.tag.agreed{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.tag.theme{background:var(--surface-2)}
.lock{display:inline-flex;gap:6px;align-items:center;font-size:.85rem;color:var(--muted);font-weight:600}
.lock svg{width:16px;height:16px}

.steps{display:flex;flex-wrap:wrap;gap:8px;list-style:none;margin:0;padding:0}
.steps li button{padding:7px 14px;border-radius:999px;border:1px solid var(--line);font-size:.86rem;background:var(--surface);color:var(--text);cursor:pointer;min-height:36px}
.steps li button[aria-current="step"]{background:var(--teal);border-color:var(--teal);color:var(--on-accent);font-weight:700}
.steps li button.done{border-color:var(--teal);color:var(--teal);font-weight:600}
.counter{position:sticky;top:env(safe-area-inset-top,0px);z-index:2;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 18px;display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:space-between;align-items:center}
.meter{height:8px;background:var(--line-soft);border-radius:4px;overflow:hidden;min-width:120px;flex:1;max-width:220px}
.meter span{display:block;height:100%;background:var(--magenta)}

table.needs{width:100%;border-collapse:collapse}
table.needs th{font-size:.8rem;color:var(--muted);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line);text-align:center;width:90px}
table.needs th:first-child{text-align:left;padding-left:0;width:auto}
table.needs td{padding:10px 8px;border-bottom:1px solid var(--line-soft);text-align:center}
table.needs td:first-child{text-align:left;padding-left:0;line-height:1.4}
table.needs tr:last-child td{border-bottom:0}
table.needs input{width:22px;height:22px;accent-color:var(--teal);cursor:pointer}

.sugg{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 20px;display:flex;flex-direction:column;gap:10px}
.sugg.kept{border:2px solid var(--teal)}
.sugg.rejected{background:var(--surface-2)}
.sugg.rejected h3{text-decoration:line-through;color:var(--muted)}
.sugg .for{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:.86rem;color:var(--muted)}
.why{background:var(--surface-2);border-radius:8px;padding:10px 14px;font-size:.95rem}
.acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ai{border:1.5px dashed var(--purple);background:var(--purple-tint);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:12px}
.ai-label{font-size:.75rem;font-weight:700;color:var(--purple);letter-spacing:.06em;text-transform:uppercase}
.thread{display:flex;flex-direction:column;gap:10px;max-height:420px;overflow-y:auto}
.msg{padding:10px 14px;border-radius:12px;font-size:.95rem;max-width:92%}
.msg.bot{background:var(--surface);border:1px solid var(--purple-line);align-self:flex-start}
.msg.me{background:var(--teal);color:var(--on-accent);align-self:flex-end}
.thinking{display:inline-flex;gap:4px}
.thinking i{width:7px;height:7px;border-radius:50%;background:var(--purple);opacity:.4;animation:blink 1.2s infinite}
.thinking i:nth-child(2){animation-delay:.2s}.thinking i:nth-child(3){animation-delay:.4s}
@keyframes blink{50%{opacity:1}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

.disclaimer{border:1px solid var(--line);border-left-width:1px;background:var(--surface);border-radius:8px;padding:12px 16px;font-size:.9rem}
.banner{border:2px solid var(--teal);border-radius:10px;background:var(--surface);padding:18px 22px;display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between}
.banner.sign{border-color:var(--magenta);background:var(--magenta-tint);color:var(--ink)}
.banner.sign strong{color:inherit}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 16px;padding:12px 0;border-bottom:1px solid var(--line-soft)}
.list li:last-child{border-bottom:0}
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px;font-size:.92rem}
.tl li{display:flex;gap:12px}
.tl .dot{width:10px;height:10px;border-radius:50%;background:var(--magenta);margin-top:6px;flex:none}
.cmt{border-top:1px solid var(--line-soft);padding-top:10px;display:flex;flex-direction:column;gap:6px;font-size:.95rem}
.opt{display:flex;gap:10px;align-items:center;min-height:44px;padding:0 14px;border:1px solid var(--line);border-radius:8px;cursor:pointer;background:var(--surface)}
.opt:has(input:checked){border-color:var(--teal);background:var(--teal-tint)}
.opt input{margin:0;width:18px;height:18px;accent-color:var(--teal)}
.choice{display:flex;gap:12px;align-items:flex-start;padding:16px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer}
.choice:has(input:checked){border:2px solid var(--teal)}
.choice input{width:20px;height:20px;margin:2px 0 0;flex:none;accent-color:var(--teal)}
.code{width:48px;height:56px;text-align:center;font-size:1.4rem;border:1px solid var(--line);border-radius:5px;background:var(--surface)}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 20px;display:flex;flex-direction:column;gap:2px}
.stat strong{font-size:1.8rem;color:var(--ink);font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto}
table.pupils{width:100%;border-collapse:collapse;min-width:560px}
table.pupils th{text-align:left;font-size:.8rem;color:var(--muted);font-weight:600;padding:8px 12px;border-bottom:1px solid var(--line)}
table.pupils td{padding:12px;border-bottom:1px solid var(--line-soft)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:8px;font-weight:600;z-index:20;max-width:calc(100% - 32px)}
.email{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.email .meta{padding:14px 20px;border-bottom:1px solid var(--line-soft);font-size:.88rem;display:flex;flex-direction:column;gap:2px;background:var(--surface-2)}
.email .body{padding:22px;display:flex;flex-direction:column;gap:14px}
.sr{position:absolute;left:-9999px}
footer.ft{border-top:1px solid var(--line);background:var(--surface)}
footer.ft .in{max-width:1180px;margin:0 auto;padding-block:18px;display:flex;flex-wrap:wrap;gap:8px 20px;font-size:.88rem;color:var(--muted)}
</style>
</head>
<body style="margin:0">
<div id="app" class="app"></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  ${THEMES.map(t=>`<section class="card" aria-labelledby="th-${t.id}"><h2 id="th-${t.id}">${t.label}</h2>
    <table class="needs"><thead><tr><th scope="col">Need</th><th scope="col">At school</th><th scope="col">At home</th></tr></thead><tbody>
    ${NEEDS.filter(x=>x.theme===t.id).map(x=>{const v=p.needs[x.id]||{};return `<tr><td>${x.label}</td><td><input type="checkbox" data-need="${x.id}" data-where="school" ${v.school?"checked":""} aria-label="${esc(x.label)} at school"></td><td><input type="checkbox" data-need="${x.id}" data-where="home" ${v.home?"checked":""} aria-label="${esc(x.label)} at home"></td></tr>`;}).join("")}
    </tbody></table></section>`).join("")}
  ${navRow(1,3,"Next: In your own words")}</main>`; };

V.step3 = p => `<main class="narrow">${stepper(p,3)}
  <div class="stack"><h1>In your own words</h1><p class="lede">There are no right answers. Write it how you'd say it to a friend, and ask ${esc(name(p))} what they think too. Skip anything you like.</p><span class="lock">${I.lock}We remove names before your answers go to the AI.</span></div>
  <section class="card" aria-label="Questions">
    ${PROMPTS.map((q,i)=>`<div class="stack" style="gap:8px;${i?'border-top:1px solid var(--line-soft);padding-top:14px':''}">
      <label class="field" style="font-size:1rem">${i+1}. ${q}<textarea id="q${i}" data-answer="${i}">${esc(p.answers[i])}</textarea></label>
      ${i<4?`<div><button class="btn quiet" type="button" data-act="toast" data-msg="Voice input isn't decided yet. This shows where it would go.">${I.mic}Speak instead</button></div>`:""}
    </div>`).join("")}
  </section>
  <section class="card" aria-labelledby="known-h"><h2 id="known-h">Adjustments that already work <span class="hint">(optional)</span></h2>
    <p class="muted">Paste anything already agreed with a school, nursery or club, in any format. Or add things you know help. These are shown to the teacher alongside the suggestions.</p>
    <label class="field">Paste an existing plan or notes<textarea id="pasted" data-bind="pasted">${esc(p.pasted)}</textarea></label>
    <ul class="list">${p.known.map(k=>`<li><span>${esc(k.text)}</span><button class="linkbtn" style="color:var(--teal)" data-delknown="${k.id}">Remove</button></li>`).join("")}</ul>
    <form class="row" data-form="known"><label class="sr" for="known-in">New adjustment</label><input id="known-in" class="ta" style="flex:1;min-width:200px;padding:10px 12px;border:1px solid var(--line);border-radius:5px;background:var(--surface)" placeholder="e.g. Ear defenders for assemblies"><button class="btn" type="submit">+ Add</button></form>
  </section>
  ${navRow(2,4, p.generated?"Next: Suggestions":"Get suggestions")}</main>`;

V.step4 = p => {
  const kept=p.suggestions.filter(s=>s.status==="kept").length, rej=p.suggestions.filter(s=>s.status==="rejected").length, pend=p.suggestions.filter(s=>s.status==="pending").length;
  if(S.loading) return `<main class="narrow">${stepper(p,4)}<section class="ai" style="align-items:center;padding:48px 20px;text-align:center"><span class="ai-label">AI assistant</span><h2>Thinking about ${pickedNeeds(p).length} needs…</h2><span class="thinking" aria-label="Loading"><i></i><i></i><i></i></span><p class="muted">Only the needs and your answers are used. Names and contact details are removed.</p></section></main>`;
  return `<main>${stepper(p,4)}
  <div class="row between" style="align-items:flex-end"><div class="stack" style="max-width:680px"><h1>Suggested adjustments for ${esc(name(p))}</h1><p class="lede">Keep the ones that feel right, change or remove the rest. Nothing goes to the school until you say so.</p></div>
    <p style="font-weight:700;color:var(--ink)">${kept} kept · ${rej} removed · ${pend} to decide</p></div>
  <p class="disclaimer" role="note"><strong style="color:var(--ink)">These are suggestions, not medical or clinical advice.</strong> They are a starting point for your conversation with the school. You and the teacher decide what works. <a href="#" data-act="toast" data-msg="Thanks. In the real app this sends a report to ADHD Scotland.">Report a problem with a suggestion</a></p>
  <div class="split">
    <section class="main" aria-label="Suggestions">
      ${p.suggestions.length?"":`<div class="card"><p>No needs picked yet. <a href="#" data-step="2">Go back and tick some needs</a> to get suggestions.</p></div>`}
      ${p.suggestions.map(s=>suggCard(p,s)).join("")}
      ${p.known.map(k=>`<article class="sugg kept"><div class="for"><span class="tag theme">Added by you</span></div><h3>${esc(k.text)}</h3><div class="acts"><button class="btn quiet" data-delknown="${k.id}">Remove</button></div></article>`).join("")}
      <form class="card" data-form="own" style="gap:10px"><label class="field">Add your own adjustment<input id="own-in" placeholder="Something you know helps"></label><div><button class="btn" type="submit">+ Add</button></div></form>
      <div class="row"><button class="btn" data-act="regen" ${rej||pend?"":"disabled"}>${I.redo}Regenerate the ones I haven't kept</button></div>
    </section>
    <aside class="side ai" aria-labelledby="talk-h">
      <span class="ai-label">AI assistant</span><h2 id="talk-h">Talk it through</h2>
      <div class="thread" aria-live="polite" id="thread">
        ${p.chat.map(m=>`<p class="msg ${m.who}">${esc(m.text)}</p>`).join("")}
        ${S.chatThinking?`<p class="msg bot"><span class="thinking" aria-label="Thinking"><i></i><i></i><i></i></span></p>`:""}
      </div>
      <form class="stack" data-form="chat" style="gap:8px"><label for="chat-in" class="field">Tell us more, or ask a question</label><textarea id="chat-in" class="ta" style="min-height:70px" placeholder="e.g. He hates being singled out in front of the class"></textarea>
        <div class="row" style="gap:8px"><button class="btn primary" type="submit">Send</button><button class="btn quiet" type="button" aria-label="Speak instead" data-act="toast" data-msg="Voice input isn't decided yet.">${I.mic}</button></div></form>
      <p class="muted">The assistant only sees needs and your answers, never names or contact details.</p>
    </aside>
  </div>
  ${navRow(3,5,"Next: Review & send")}</main>`;
};
function suggCard(p,s){
  const v=p.needs[s.needId]||{};
  if(s.status==="rejected") return `<article class="sugg rejected"><div class="for"><span class="tag theme">${themeLabel(s.theme)}</span>For: ${esc(needLabel(s.needId).toLowerCase())}</div><h3>${esc(s.title)}</h3>
    <label class="field">What's not right about this one? <span class="hint">Helps us improve</span><textarea id="fb-${s.id}" data-fb="${s.id}" style="min-height:60px">${esc(s.feedback)}</textarea></label>
    <div class="acts"><button class="btn" data-alt="${s.id}">${I.redo}Suggest something else</button><button class="btn quiet" data-undo="${s.id}">Undo</button></div></article>`;
  return `<article class="sugg ${s.status==="kept"?"kept":""}"><div class="for"><span class="tag theme">${themeLabel(s.theme)}</span>For: ${esc(needLabel(s.needId).toLowerCase())} · ${where(v)}</div>
    ${s.editing?`<label class="field">Adjustment<input id="ed-${s.id}" data-edit="${s.id}" value="${esc(s.title)}"></label><div><button class="btn" data-doneedit="${s.id}">Done</button></div>`:`<h3>${esc(s.title)}</h3>`}
    <p class="why"><strong style="color:var(--ink)">Why this helps:</strong> ${esc(s.why)}${s.changed?' <em>(Changed after your message.)</em>':''}</p>
    ${s.noteOpen||s.note?`<label class="field">Note for the teacher<textarea id="nt-${s.id}" data-note="${s.id}" style="min-height:56px">${esc(s.note)}</textarea></label>`:""}
    <div class="acts">
      <button class="btn ${s.status==="kept"?"on":"primary"}" data-keep="${s.id}" aria-pressed="${s.status==="kept"}">${I.up}${s.status==="kept"?"Kept":"Keep"}</button>
      <button class="btn quiet" data-reject="${s.id}">${I.down}Not right</button>
      <button class="btn quiet" data-editopen="${s.id}">Edit</button>
      ${s.noteOpen||s.note?"":`<button class="btn quiet" data-noteopen="${s.id}">Add a note</button>`}
    </div></article>`;
}

V.step5 = p => { const kept=p.suggestions.filter(s=>s.status==="kept"); return `<main>${stepper(p,5)}
  <div class="stack"><h1>Check and send to school</h1><p class="lede">The teacher will look at each adjustment, say whether it works in their school, and add comments. Then you both sign it off.</p></div>
  <div class="split">
    <section class="main card"><div class="row between"><h2>${esc(p.child.first||"Your child")}'s passport</h2><a href="#" data-step="4">Edit</a></div>
      <p class="muted">${esc([p.school.year,p.school.name,p.school.teacher].filter(Boolean).join(" · ")||"Add school details in step 1")}</p>
      <h3>Needs (${pickedNeeds(p).length})</h3><ul style="margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px">${pickedNeeds(p).map(id=>`<li>${needLabel(id)} (${where(p.needs[id])})</li>`).join("")||"<li>None picked yet</li>"}</ul>
      <h3>Adjustments to discuss (${kept.length+p.known.length})</h3><ul style="margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px">${kept.map(s=>`<li>${esc(s.title)}</li>`).join("")}${p.known.map(k=>`<li>${esc(k.text)} <span class="muted">(added by you)</span></li>`).join("")||(kept.length?"":"<li>None kept yet</li>")}</ul>
    </section>
    <div class="side">
      <section class="card"><h2>What the teacher can see</h2><p class="muted">Always shared: first name, class, needs, adjustments and why they help.</p>
        <label class="check"><input type="checkbox" data-share="dx" ${p.share.dx?"checked":""}><span>Diagnoses (confirmed and suspected)</span></label>
        <label class="check"><input type="checkbox" data-share="answers" ${p.share.answers?"checked":""}><span>My answers from "In your own words"</span></label>
        <p class="muted">Never shared: your email, phone or ${esc(name(p))}'s date of birth.</p></section>
      <form class="card" data-form="send"><h2>Send to</h2>
        <label class="field">Teacher's school email<input id="snd-email" type="email" data-bind="school.email" value="${esc(p.school.email)}" required></label>
        <label class="field">Review this in<select id="snd-rev" data-bind="send.review">${["3 months","6 months","End of school year"].map(r=>`<option ${p.send.review===r?"selected":""}>${r}</option>`).join("")}</select></label>
        <label class="field">Message to the teacher <span class="hint">Optional</span><textarea id="snd-msg" data-bind="send.msg" style="min-height:80px">${esc(p.send.msg)}</textarea></label>
        <label class="check"><input type="checkbox" data-bind-check="send.withChild" ${p.send.withChild?"checked":""}><span>I've gone through this with ${esc(name(p))}</span></label>
        <button class="btn primary" type="submit" ${kept.length+p.known.length?"":"disabled"}>Send to school</button>
        ${kept.length+p.known.length?"":`<p class="hint">Keep at least one adjustment first.</p>`}
      </form>
    </div>
  </div>
  <div class="row"><button class="btn quiet" data-step="4">Back</button></div></main>`; };

V.passport = p => {
  const t=p.signoff.teacher;
  const ag=p.suggestions.filter(s=>s.status==="kept" && s.teacher.decision!=="no");
  const no=p.suggestions.filter(s=>s.status==="kept" && s.teacher.decision==="no");
  const dec = s => ({yes:"Agreed",changes:"Agreed with changes",no:"Not possible here","":"Waiting for teacher"}[s.teacher.decision]);
  return `<main>
  <div class="row between" style="align-items:flex-end"><div class="stack" style="gap:8px"><a href="#" data-go="home">← My passports</a><h1>${esc(p.child.first)}'s accessibility passport</h1><p class="muted">${esc([p.school.year,p.school.name].filter(Boolean).join(" · "))}</p></div>
    <div class="row"><button class="btn quiet" data-act="toast" data-msg="In the real app this downloads a PDF">Download PDF</button>${p.status==="agreed"?`<button class="btn" data-review="${p.id}">Update or review</button>`:""}</div></div>
  ${p.status==="with_teacher"?`<section class="banner"><div class="stack" style="gap:4px"><strong style="color:var(--ink)">Waiting for ${esc(p.school.teacher||"the teacher")} to review</strong><span class="muted">Sent to ${esc(p.school.email)}. Switch to the teacher view at the top to see what they get.</span></div><button class="btn" data-act="role" data-v="teacher">See the teacher side</button></section>`:""}
  ${p.status==="teacher_signed"?`<section class="banner sign"><div class="stack" style="gap:4px"><strong>${esc(t.name)} has signed. Please check their comments and sign.</strong><span>Once you sign, the passport is agreed and you'll get a reminder to review it.</span></div><button class="btn primary" data-act="parentsign">Sign as ${esc(p.parent.name)}</button></section>`:""}
  ${p.status==="agreed"?`<section class="banner" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))"><div class="stack" style="gap:6px"><span class="tag agreed" style="align-self:flex-start">Agreed</span><span class="muted">Both people have signed</span></div><div class="stack" style="gap:2px"><strong style="color:var(--ink)">${esc(t.name)}</strong><span class="muted">${esc(t.role)} · signed ${esc(t.date)}</span></div><div class="stack" style="gap:2px"><strong style="color:var(--ink)">${esc(p.parent.name)}</strong><span class="muted">${esc(p.parent.rel)} · signed ${esc(p.signoff.parent.date)}</span></div><div class="stack" style="gap:2px"><strong style="color:var(--ink)">Review by ${fmtDate(t.review)}</strong><a href="#" data-act="toast" data-msg="In the real app this adds a calendar event">Add to calendar</a></div></section>`:""}
  <div class="split">
    <div class="main">
      <section class="card"><h2>${p.status==="with_teacher"?"Adjustments sent":"Agreed adjustments"} (${ag.length+p.known.length})</h2>
        <ul class="list">${ag.map(s=>`<li style="flex-direction:column;align-items:flex-start"><h3>${esc(s.title)}</h3><span class="muted">For: ${esc(needLabel(s.needId).toLowerCase())} · ${dec(s)}</span>${s.teacher.comment?`<span>Teacher's note: "${esc(s.teacher.comment)}"</span>`:""}</li>`).join("")}${p.known.map(k=>`<li style="flex-direction:column;align-items:flex-start"><h3>${esc(k.text)}</h3><span class="muted">Added by parent</span></li>`).join("")}</ul></section>
      ${no.length?`<section class="card"><h2>Not possible right now (${no.length})</h2><ul class="list">${no.map(s=>`<li style="flex-direction:column;align-items:flex-start"><h3>${esc(s.title)}</h3><span>Teacher's note: "${esc(s.teacher.comment)}"</span></li>`).join("")}</ul></section>`:""}
      ${p.status==="agreed"?`<section class="card"><h2 style="font-size:1.05rem">Were the suggestions helpful?</h2><div class="row"><button class="btn quiet" data-act="toast" data-msg="Thanks for the feedback">Yes</button><button class="btn quiet" data-act="toast" data-msg="Thanks for the feedback">Partly</button><button class="btn quiet" data-act="toast" data-msg="Thanks for the feedback">No</button></div></section>`:""}
    </div>
    <aside class="side card"><h2 style="font-size:1.1rem">History</h2><ol class="tl">${p.history.map(h=>`<li><span class="dot"></span><span>${esc(h.text)}<br><span class="muted">${esc(h.t)}</span></span></li>`).join("")}</ol>
      <p class="muted">Who can see this: you${p.status!=="draft"?", "+esc(p.school.teacher):""}.</p></aside>
  </div></main>`;
};

V["review-due"] = p => `<main class="narrow">
  <div class="stack"><a href="#" data-open="${p.id}">← ${esc(p.child.first)}'s passport</a><h1>Time to check in on ${esc(p.child.first)}'s passport</h1><p class="lede">Needs change as children grow. What's changed since you and ${esc(p.signoff.teacher?p.signoff.teacher.name:"the teacher")} agreed it?</p></div>
  <fieldset class="stack"><legend class="muted" style="font-weight:400">Choose one</legend>
    ${[["keep","Things are working, keep it as it is","We'll ask the teacher to confirm and set a new review date."],["changed","Some things have changed","Update needs and answers, then get fresh suggestions. Kept adjustments stay."],["teacher","New teacher or new class","Hand the passport over and set up a conversation with the new teacher."],["school","Moving school","For example primary to secondary. You choose who at the new school sees it."]].map(([v,t,d])=>`<label class="choice"><input type="radio" name="rv" data-rv="${v}" ${S.review.choice===v?"checked":""}><span><strong style="display:block;color:var(--ink)">${t}</strong><span class="muted">${d}</span></span></label>`).join("")}
  </fieldset>
  ${S.review.choice==="teacher"||S.review.choice==="school"?`<form class="card" data-form="handover"><h2>Hand over to the new ${S.review.choice==="school"?"school":"teacher"}</h2><div class="grid2">
      ${S.review.choice==="school"?`<label class="field">New school<input id="ho-school" placeholder="School name"></label>`:`<label class="field">New class<input id="ho-class" value="Primary 6"></label>`}
      <label class="field">New teacher's name<input id="ho-name" required></label><label class="field">New teacher's school email<input id="ho-email" type="email" required></label></div>
    <label class="check"><input type="checkbox" checked><span>Ask them to meet and review it with us. Agreed adjustments carry over until then.</span></label>
    <label class="check"><input type="checkbox"><span>Remove the previous teacher's access</span></label>
    <div class="row"><button class="btn primary" type="submit">Send to new teacher</button><button class="btn quiet" type="button" data-go="home">Remind me later</button></div></form>`:
  S.review.choice==="changed"?`<div class="row"><button class="btn primary" data-act="reopen">Update needs and answers</button></div>`:
  `<div class="row"><button class="btn primary" data-act="keepasis">Ask teacher to confirm</button></div>`}
  </main>`;

/* ---------- Teacher screens ---------- */
const TP = () => S.passports.find(p=>p.id===S.teacherPid) || S.passports.find(p=>p.status==="with_teacher") || S.passports[0];
V["t-email"] = () => { const p=TP(); return `<main>
  <div class="stack"><h1>What the teacher receives</h1><p class="muted">Teachers don't need an account. They get this email and confirm with a code. (Whether teachers get full logins is still an open question.)</p></div>
  <div class="split"><section class="main email" aria-label="Email">
    <div class="meta"><span><strong>From:</strong> School Accessibility Passport &lt;no-reply@passport.example&gt;</span><span><strong>To:</strong> ${esc(p.school.email)}</span><span><strong>Subject:</strong> ${esc(p.parent.name)} has shared ${esc(p.child.first)}'s accessibility passport</span></div>
    <div class="body"><span class="chip" style="background:#fff;border-radius:8px;padding:4px 6px;align-self:flex-start;display:flex"><img src="${LOGO}" alt="ADHD Scotland" style="height:48px"></span>
      <h2>${esc(p.parent.name)} would like to agree some adjustments for ${esc(p.child.first)} (${esc(p.school.year)})</h2>

      ${p.send.msg?`<p class="why"><strong style="color:var(--ink)">Message from ${esc(p.parent.name)}:</strong> "${esc(p.send.msg)}"</p>`:""}
      <div><button class="btn primary" data-go="t-code">Review ${esc(p.child.first)}'s passport</button></div>

  </section>
  <aside class="side card"><h2 style="font-size:1.05rem">Try another pupil</h2><p class="muted">Pick which example passport this email is about.</p>
    ${S.passports.filter(x=>x.status!=="draft").map(x=>`<button class="btn ${x.id===p.id?"on":"quiet"}" data-tpick="${x.id}">${esc(x.child.first)} · ${statusTag(x)}</button>`).join("")}</aside></div></main>`; };
V["t-code"] = () => { const p=TP(); return `<main class="narrow" style="max-width:520px"><form class="card" data-form="code">

  <label class="check"><input type="checkbox"> Remember this device for 30 days</label>
  <button class="btn primary" type="submit">Continue</button><a href="#" data-act="toast" data-msg="New code sent (not really, it's a prototype)">Send a new code</a></form></main>`; };
V["t-home"] = () => { const list=S.passports.filter(p=>p.status!=="draft"); const c=k=>list.filter(p=>p.status===k).length; return `<main>
  <div class="stack"><h1>Passports shared with you</h1><p class="muted">Only pupils whose parents have shared a passport with you appear here. (Shown in case full teacher logins are chosen.)</p></div>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px"><div class="stat"><span class="muted">Waiting for you</span><strong>${c("with_teacher")}</strong></div><div class="stat"><span class="muted">Waiting for parent</span><strong>${c("teacher_signed")}</strong></div><div class="stat"><span class="muted">Agreed</span><strong>${c("agreed")}</strong></div></div>
  <section class="card"><h2>Pupils</h2><div class="tablewrap"><table class="pupils"><thead><tr><th scope="col">Pupil</th><th scope="col">Class</th><th scope="col">Status</th><th scope="col">Last update</th><th scope="col"><span class="sr">Action</span></th></tr></thead><tbody>
  ${list.map(p=>`<tr><td>${esc(p.child.first)}</td><td>${esc(p.school.year)}</td><td>${statusTag(p).replace("Ready for your signature","Waiting for parent").replace("With teacher","Waiting for you")}</td><td class="muted">${esc(p.history[0].t)}</td><td><button class="btn ${p.status==="with_teacher"?"primary":"quiet"}" data-topen="${p.id}">${p.status==="with_teacher"?"Review":"Open"}</button></td></tr>`).join("")}
  </tbody></table></div></section></main>`; };
V["t-review"] = () => { const p=TP(); const items=p.suggestions.filter(s=>s.status==="kept"); const locked=p.status!=="with_teacher"; return `<main>
  <div class="stack"><h1>${esc(p.child.first)} · ${esc(p.school.year)}</h1><p class="muted">Shared by ${esc(p.parent.name)} · ${esc(p.school.name)}</p>
  <p class="lede">${locked?"You've already signed this passport. This is a read-only view.":"For each adjustment, say whether it can work in your school. Comments go to the parent. Nothing is final until you both sign off."}</p></div>
  <div class="split">
    <aside class="side card"><h2 style="font-size:1.1rem">About ${esc(p.child.first)}</h2>
      ${p.share.dx&&(p.dx.confirmed.length||p.dx.suspected.length)?`<p class="muted">Diagnosis (shared by parent): ${esc([...p.dx.confirmed,...p.dx.suspected.map(d=>d+" (suspected)")].join(", "))}</p>`:`<p class="muted">The parent hasn't shared diagnoses.</p>`}
      <h3>What ${esc(p.child.first)} finds hard</h3><ul style="margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px">${pickedNeeds(p).map(id=>`<li>${needLabel(id)} (${where(p.needs[id])})</li>`).join("")}</ul>
      ${p.share.answers&&p.answers[3]?`<h3>What ${esc(p.child.first)} wants you to know</h3><p style="font-style:italic">${esc(p.answers[3])}</p>`:""}
      ${p.known.length?`<h3>Already works</h3><ul style="margin:0;padding-left:20px">${p.known.map(k=>`<li>${esc(k.text)}</li>`).join("")}</ul>`:""}
    </aside>
    <section class="main" aria-label="Adjustments">
      ${items.map(s=>`<article class="sugg"><div class="for"><span class="tag theme">${themeLabel(s.theme)}</span>For: ${esc(needLabel(s.needId).toLowerCase())}</div><h3>${esc(s.title)}</h3>
        <p class="why"><strong style="color:var(--ink)">Why this helps:</strong> ${esc(s.why)}</p>
        ${s.note?`<p><strong style="color:var(--ink)">Parent's note:</strong> ${esc(s.note)}</p>`:""}
        <fieldset ${locked?"disabled":""}><legend class="muted" style="font-weight:400;margin-bottom:8px">Can this work in your school?</legend><div class="row" style="gap:8px">
          ${[["yes","Yes"],["changes","Yes, with changes"],["no","Not possible here"]].map(([v,l])=>`<label class="opt"><input type="radio" name="d-${s.id}" data-dec="${s.id}" value="${v}" ${s.teacher.decision===v?"checked":""}>${l}</label>`).join("")}</div></fieldset>
        ${s.teacher.decision&&s.teacher.decision!=="yes"||s.teacher.comment?`<label class="field">${s.teacher.decision==="no"?"Tell the parent why (required)":"Comment for the parent"}<textarea id="tc-${s.id}" data-tcom="${s.id}" style="min-height:60px" ${locked?"disabled":""}>${esc(s.teacher.comment)}</textarea></label>`:""}
        ${s.teacher.decision==="no"&&!locked?`<div><button class="btn quiet" data-talt="${s.id}">${I.redo}Suggest an alternative that works here</button></div>`:""}
      </article>`).join("")}
      ${p.known.map(k=>`<article class="sugg"><div class="for"><span class="tag theme">Added by parent</span></div><h3>${esc(k.text)}</h3></article>`).join("")}
    </section>
  </div>
  ${locked?`<div class="row"><button class="btn" data-go="t-home">Back to my pupils</button></div>`:`<form class="card hl" data-form="tsign"><h2>Sign off</h2>
    <p>Once you sign, ${esc(p.parent.name)} will be asked to sign too. You'll both get a copy, and it passes to the next teacher if ${esc(p.child.first)} changes class.</p>
    <div class="grid2"><label class="field">Your full name<input id="ts-name" required value="${esc((p.school.teacher||"").replace(/\s*\(.*\)/,""))}"></label>
      <label class="field">Your role<select id="ts-role"><option>Class teacher</option><option>Support for learning / ASN teacher</option><option>Guidance / pupil support</option><option>Head teacher</option></select></label>
      <label class="field">Review date<input id="ts-review" type="date" required value="${new Date(Date.now()+90*864e5).toISOString().slice(0,10)}"></label></div>
    <p class="hint" id="ts-err" hidden></p>
    <div class="row"><button class="btn primary" type="submit">Sign off and send to parent</button><button class="btn quiet" type="button" data-act="toast" data-msg="Comments saved">Save comments, sign later</button></div></form>`}
  </main>`; };
V["t-done"] = () => { const p=TP(); return `<main class="narrow"><section class="card hl" style="align-items:flex-start"><span class="tag agreed">Signed</span><h1>Thanks. ${esc(p.parent.name)} has been asked to sign.</h1><p>You'll get an email when it's fully agreed. A reminder will go to you both before ${fmtDate(p.signoff.teacher.review)}.</p><div class="row"><button class="btn primary" data-act="role" data-v="parent">See the parent side</button><button class="btn" data-go="t-home">Back to my pupils</button></div></section></main>`; };

V.sent = p => `<main class="narrow"><section class="card hl" style="align-items:flex-start"><span class="tag teacher">Sent</span><h1>${esc(p.child.first||"Your child")}'s passport is on its way to ${esc(p.school.teacher||"the teacher")}</h1>
  <p>We've emailed ${esc(p.school.email)}. You'll hear when they've reviewed it. It usually helps to mention it to them in person too.</p>
  <div class="row"><button class="btn primary" data-act="role" data-v="teacher">See what the teacher gets</button><button class="btn" data-go="home">Back to my passports</button></div></section></main>`;

/* ---------- Render ---------- */
function applySettings(){
  const st=S.settings, app=document.getElementById("app");
  app.className = "app" + (st.font==="dys"?" font-dys":"") + (st.bg!=="default"?" bg-"+st.bg:"") + (st.reduce?" reduce":"");
  document.documentElement.style.fontSize = [93.75,100,112.5,125][st.size]+"%";
  app.style.setProperty("--lh",[1.4,1.55,1.8][st.spacing]);
  document.body.style.background = getComputedStyle(app).getPropertyValue("--bg");
}
function render(focusSel){
  const r=S.route; let inner;
  if(S.role==="teacher"){
    if(!S.teacherVerified && !["t-email","t-code"].includes(r)) S.route="t-email";
    inner = V[S.route] ? V[S.route]() : V["t-email"]();
  } else {
    if(!S.signedIn && !["signin","register"].includes(r)) S.route="signin";
    const p=P(), cur=S.route;
    if(cur.startsWith("step")||["passport","review-due","sent"].includes(cur)){ inner = p ? V[cur](p) : V.home(); }
    else inner = (V[S.route]||V.home)();
  }
  document.getElementById("app").innerHTML = shell(inner);
  applySettings(); save();
  const th=document.getElementById("thread"); if(th) th.scrollTop=th.scrollHeight;
  if(focusSel){ const el=document.querySelector(focusSel); if(el) el.focus(); }
}
function go(route){ S.route=route; render(); window.scrollTo(0,0); }
let toastT;
function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true,2600); }
function setPath(obj,path,val){ const k=path.split("."); let o=obj; while(k.length>1) o=o[k.shift()]; o[k[0]]=val; }

/* Mock AI */
function generate(p){
  const ids=pickedNeeds(p).slice(0,10);
  S.loading=true; render();
  setTimeout(()=>{
    p.suggestions = ids.map(id=>makeSugg(id,0));
    p.generated=true;
    p.chat=[{who:"bot",text:`I've suggested ${ids.length} adjustment${ids.length===1?"":"s"} from the needs you picked. Is there anything here that wouldn't suit ${name(p)}? Tell me and I'll adjust.`}];
    p.history.unshift({t:today(),text:"Got AI suggestions"});
    S.loading=false; render();
  },1400);
}
function nextAlt(p,s){
  const used=p.suggestions.filter(x=>x.needId===s.needId).map(x=>x.alt);
  const opts=LIB[s.needId].map((_,i)=>i).filter(i=>!used.includes(i));
  const alt = opts.length?opts[0]:(s.alt+1)%LIB[s.needId].length;
  const n=makeSugg(s.needId,alt); return n;
}
function chatReply(p,text){
  const t=text.toLowerCase(); let reply;
  const f=p.suggestions.find(s=>s.needId==="focus"&&s.status!=="rejected");
  if(/single|in front|embarrass|attention to|stand out/.test(t)){
    if(f && f.alt!==0){ const i=p.suggestions.indexOf(f); const n=makeSugg("focus",0); n.status=f.status; n.changed=true; p.suggestions[i]=n; }
    else if(f){ f.changed=true; }
    reply="Thanks, that's really useful. I've made sure the ideas don't single them out. For example, movement breaks can be asked for with a quiet signal card instead of out loud.";
  } else if(/assistant|staff|resource|budget|can't|cannot|won't/.test(t)){
    reply="Good to know. Mark that one as 'Not right' and I'll suggest something that doesn't need extra staff. The teacher can also suggest alternatives when they review it.";
  } else if(/home|evening|bedtime|homework/.test(t)){
    reply="Home matters too. Adjustments like lighter homework on hard days or an end-of-day check-in can ease evenings. Want me to add one? Tick 'Holds it together at school, then falls apart at home' in step 2 and I'll include it.";
  } else if(/medic|medication|supplement|diet/.test(t)){
    reply="I can't give medical advice, including about medication or supplements. Your GP or the NHS can help with that. I can help with adjustments at school.";
  } else {
    reply="Thanks, I've noted that. If any suggestion doesn't fit, mark it 'Not right' and tell me why, and I'll find another.";
  }
  return reply;
}

/* ---------- Events ---------- */
const app=document.getElementById("app");
app.addEventListener("click",e=>{
  const b=e.target.closest("button,a"); if(!b) return;
  const d=b.dataset; const p=P();
  if(b.tagName==="A" && (b.getAttribute("href")||"").startsWith("#")) e.preventDefault();
  if(d.go){ go(d.go); return; }
  if(d.step){ const n=+d.step; if(!p) return;
    if(n===4 && !p.generated){ p.step=Math.max(p.step,4); S.route="step4"; generate(p); return; }
    p.step=Math.max(p.step,n); go("step"+n); return; }
  if(d.continue){ S.current=d.continue; go("step"+S.passports.find(x=>x.id===d.continue).step); return; }
  if(d.open){ S.current=d.open; go("passport"); return; }
  if(d.review){ S.current=d.review; S.review.choice="teacher"; go("review-due"); return; }
  if(d.keep){ const s=p.suggestions.find(x=>x.id===d.keep); s.status=s.status==="kept"?"pending":"kept"; render(); return; }
  if(d.reject){ const s=p.suggestions.find(x=>x.id===d.reject); s.status="rejected"; render(`#fb-${s.id}`); return; }
  if(d.undo){ p.suggestions.find(x=>x.id===d.undo).status="pending"; render(); return; }
  if(d.alt){ const i=p.suggestions.findIndex(x=>x.id===d.alt); p.suggestions[i]=nextAlt(p,p.suggestions[i]); toast("New suggestion added"); render(); return; }
  if(d.editopen){ p.suggestions.find(x=>x.id===d.editopen).editing=true; render(`#ed-${d.editopen}`); return; }
  if(d.doneedit){ p.suggestions.find(x=>x.id===d.doneedit).editing=false; render(); return; }
  if(d.noteopen){ p.suggestions.find(x=>x.id===d.noteopen).noteOpen=true; render(`#nt-${d.noteopen}`); return; }
  if(d.delknown){ p.known=p.known.filter(k=>k.id!==d.delknown); render(); return; }
  if(d.tpick){ S.teacherPid=d.tpick; render(); return; }
  if(d.topen){ S.teacherPid=d.topen; go("t-review"); return; }
  if(d.talt){ const tp=TP(); const i=tp.suggestions.findIndex(x=>x.id===d.talt); const n=nextAlt(tp,tp.suggestions[i]); n.status="kept"; n.teacher={decision:"yes",comment:"Suggested by the teacher instead of: "+tp.suggestions[i].title}; tp.suggestions[i]=n; toast("Alternative added for the parent to see"); render(); return; }
  const a=d.act; if(!a) return;
  if(a==="role"){ S.role=d.v; if(d.v==="teacher"){ S.route=S.teacherVerified?"t-home":"t-email"; } else { S.route=S.signedIn?"home":"signin"; } render(); window.scrollTo(0,0); }
  else if(a==="reset"){ try{localStorage.removeItem(KEY);}catch(_){} S=seed(); render(); toast("Demo reset"); }
  else if(a==="signin"){ S.signedIn=true; go("home"); }
  else if(a==="signout"){ S.signedIn=false; go("signin"); }
  else if(a==="t-signout"){ S.teacherVerified=false; go("t-email"); }
  else if(a==="new"){ const n=blankPassport(); S.passports.push(n); S.current=n.id; go("step1"); }
  else if(a==="toast"){ toast(d.msg); }
  else if(a==="nudge"){ toast("Reminder sent to the teacher"); }
  else if(a==="regen"){ p.suggestions=p.suggestions.map(s=>s.status==="kept"?s:nextAlt(p,s)); toast("New ideas for the ones you haven't kept"); render(); }
  else if(a==="parentsign"){ p.signoff.parent={date:today()}; p.status="agreed"; p.history.unshift({t:today(),text:"Signed by "+p.parent.name}); toast("Passport agreed"); render(); }
  else if(a==="reopen"){ p.status="draft"; p.step=2; p.generated=true; p.history.unshift({t:today(),text:"Review started"}); go("step2"); }
  else if(a==="keepasis"){ p.status="with_teacher"; p.history.unshift({t:today(),text:"Asked teacher to confirm, no changes"}); toast("Sent to the teacher to confirm"); go("home"); }
});
app.addEventListener("input",e=>{
  const el=e.target, d=el.dataset, p=P();
  if(d.bind && p){ setPath(p,d.bind,el.value); save(); }
  else if(d.answer && p){ p.answers[+d.answer]=el.value; save(); }
  else if(d.fb){ p.suggestions.find(x=>x.id===d.fb).feedback=el.value; save(); }
  else if(d.note){ p.suggestions.find(x=>x.id===d.note).note=el.value; save(); }
  else if(d.edit){ p.suggestions.find(x=>x.id===d.edit).title=el.value; save(); }
  else if(d.tcom){ TP().suggestions.find(x=>x.id===d.tcom).teacher.comment=el.value; save(); }
  else if(d.code){ el.value=el.value.replace(/\D/g,""); if(el.value){ const nx=document.getElementById("code"+(+d.code+1)); if(nx) nx.focus(); } }
  else if(d.set==="size"||d.set==="spacing"){ S.settings[d.set]=+el.value; applySettings(); save(); }
});
app.addEventListener("change",e=>{
  const el=e.target, d=el.dataset, p=P();
  if(d.need){ const v=p.needs[d.need]||(p.needs[d.need]={school:false,home:false}); v[d.where]=el.checked; if(p.generated && el.checked && !p.suggestions.some(s=>s.needId===d.need)) p.suggestions.push(makeSugg(d.need,0)); render(`[data-need="${d.need}"][data-where="${d.where}"]`); }
  else if(d.dx){ const arr=p.dx[d.dx]; if(el.checked) arr.push(el.value); else arr.splice(arr.indexOf(el.value),1); save(); }
  else if(d.share){ p.share[d.share]=el.checked; save(); }
  else if(d.bindCheck){ setPath(p,d.bindCheck,el.checked); save(); }
  else if(d.dec){ const s=TP().suggestions.find(x=>x.id===d.dec); s.teacher.decision=el.value; render(el.value==="yes"?null:`#tc-${s.id}`); }
  else if(d.rv){ S.review.choice=d.rv; render(); }
  else if(d.set==="font"||d.set==="bg"){ S.settings[d.set]=el.value; applySettings(); save(); }
  else if(d.set==="reduce"){ S.settings.reduce=el.checked; applySettings(); save(); }
  else if(d.bind && p && el.tagName==="SELECT"){ setPath(p,d.bind,el.value); save(); }
});
app.addEventListener("submit",e=>{
  e.preventDefault(); const f=e.target.dataset.form; const p=P();
  if(f==="signin"||f==="register"){ S.signedIn=true; if(f==="register"){ const fn=document.getElementById("rg-first").value, ln=document.getElementById("rg-last").value; S.passports.forEach(x=>x.parent.name=(fn+" "+ln).trim()||x.parent.name); } go("home"); }
  else if(f==="known"||f==="own"){ const inp=document.getElementById(f==="known"?"known-in":"own-in"); const v=inp.value.trim(); if(!v) return; p.known.push({id:nid(),text:v}); render(f==="known"?"#known-in":"#own-in"); }
  else if(f==="chat"){ const inp=document.getElementById("chat-in"); const v=inp.value.trim(); if(!v) return; p.chat.push({who:"me",text:v}); S.chatThinking=true; render("#chat-in");
    setTimeout(()=>{ p.chat.push({who:"bot",text:chatReply(p,v)}); S.chatThinking=false; render("#chat-in"); },1100); }
  else if(f==="send"){ if(!p.school.email){ toast("Add the teacher's email first"); return; } p.status="with_teacher"; p.history.unshift({t:today(),text:"Sent to "+(p.school.name||"school")}); S.teacherPid=p.id; S.teacherVerified=false; go("sent"); }
  else if(f==="code"){ const code=[0,1,2,3,4,5].map(i=>document.getElementById("code"+i).value).join(""); if(code.length<6){ toast("Enter all 6 digits"); return; } S.teacherVerified=true; go(TP().status==="with_teacher"?"t-review":"t-home"); }
  else if(f==="tsign"){ const tp=TP(); const items=tp.suggestions.filter(s=>s.status==="kept");
    const undecided=items.filter(s=>!s.teacher.decision).length, noWhy=items.filter(s=>s.teacher.decision==="no"&&!s.teacher.comment.trim()).length;
    const err=document.getElementById("ts-err");
    if(undecided||noWhy){ err.hidden=false; err.style.color="var(--bad)"; err.textContent= undecided?`Decide on ${undecided} more adjustment${undecided>1?"s":""} first.`:"Add a reason for each adjustment that isn't possible."; return; }
    const nm=document.getElementById("ts-name").value.trim(); if(!nm){ err.hidden=false; err.textContent="Add your name to sign."; return; }
    tp.signoff.teacher={name:nm, role:document.getElementById("ts-role").value, date:today(), review:document.getElementById("ts-review").value};
    tp.status="teacher_signed"; const nc=items.filter(s=>s.teacher.comment).length;
    tp.history.unshift({t:today(),text:"Signed by "+nm}); if(nc) tp.history.unshift({t:today(),text:`${nm} commented on ${nc} adjustment${nc>1?"s":""}`});
    go("t-done"); }
  else if(f==="handover"){ const nm=document.getElementById("ho-name").value.trim(), em=document.getElementById("ho-email").value.trim(); if(!nm||!em){ toast("Add the new teacher's name and email"); return; }
    p.school.teacher=nm; p.school.email=em; const cl=document.getElementById("ho-class"); if(cl) p.school.year=cl.value; const sc=document.getElementById("ho-school"); if(sc&&sc.value) p.school.name=sc.value;
    p.suggestions.forEach(s=>s.teacher={decision:"",comment:""}); p.status="with_teacher"; p.history.unshift({t:today(),text:"Handed over to "+nm}); toast("Sent to "+nm); go("home"); }
});
/* Design import: ?screen=<name> opens one screen with example data, without saving */
(function(){
  let sc=null; try{ sc=new URLSearchParams(location.search).get("screen"); }catch(e){}
  if(!sc) return;
  window.__noSave=true; S=seed();
  try{ document.documentElement.setAttribute("data-theme", new URLSearchParams(location.search).get("theme")==="dark"?"dark":"light"); }catch(e){}
  const [sam,ava,jamie]=S.passports;
  const parent=r=>{ S.role="parent"; S.signedIn=true; S.route=r; };
  const teacher=r=>{ S.role="teacher"; S.teacherVerified=true; S.teacherPid=ava.id; S.route=r; };
  const map={
    "signin":()=>{ S.route="signin"; },
    "register":()=>{ S.route="register"; },
    "home":()=>parent("home"),
    "settings":()=>parent("settings"),
    "step1-details":()=>{ S.current=jamie.id; parent("step1"); },
    "step2-needs":()=>{ S.current=jamie.id; parent("step2"); },
    "step3-own-words":()=>{ S.current=ava.id; parent("step3"); },
    "step4-suggestions":()=>{ S.current=ava.id;
      ava.suggestions[2].status="pending";
      ava.suggestions[3].status="rejected"; ava.suggestions[3].feedback="She'd rather stay in the library at lunch.";
      ava.chat=[{who:"bot",text:"I've suggested 4 adjustments from the needs you picked. Is there anything here that wouldn't suit Ava?"},
                {who:"me",text:"She hates being singled out in front of the class."},
                {who:"bot",text:"Thanks, that's really useful. I've made sure the ideas don't single her out."}];
      parent("step4"); },
    "step5-review-send":()=>{ S.current=ava.id; parent("step5"); },
    "passport-agreed":()=>{ S.current=sam.id; parent("passport"); },
    "passport-to-sign":()=>{ S.current=ava.id; ava.status="teacher_signed";
      ava.suggestions.forEach(x=>x.teacher.decision="yes");
      ava.signoff.teacher={name:"Mr Khan",role:"Support for learning / ASN teacher",date:"27 Oct 2026",review:"2027-01-27"};
      parent("passport"); },
    "review-handover":()=>{ S.current=sam.id; S.review.choice="teacher"; parent("review-due"); },
    "teacher-email":()=>{ S.role="teacher"; S.teacherVerified=false; S.teacherPid=ava.id; ava.send.msg="Thanks for looking at this. Happy to chat at parents' evening."; S.route="t-email"; },
    "teacher-code":()=>{ S.role="teacher"; S.teacherVerified=false; S.teacherPid=ava.id; S.route="t-code"; },
    "teacher-review":()=>{ ava.suggestions[0].teacher.decision="yes";
      ava.suggestions[1].teacher={decision:"changes",comment:"Happy to give a warning. Supply cover is often last minute, so we'll text you when we can."};
      teacher("t-review"); },
    "teacher-home":()=>teacher("t-home")
  };
  (map[sc]||map["signin"])();
})();
render();
</script>
